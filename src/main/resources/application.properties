spring.application.name=hitbox-admin-api

server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/api/hitbox


# JPA Spring configurations
spring.jpa.hibernate.ddl-auto=update
spring.batch.jdbc.initialize-schema=always
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=hitbox}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha01}
spring.datasource.driver-class-name=org.postgresql.Driver

app.upload.dir=${DIR_UPLOADS:uploads}
secret.key.api=a9f4c2e8b7d14f6c93a1e5b8c7d2f09e4a6c1b3f8d2e7a9c5b4e1f6d8c3a2b7

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

# Exibe SQL
spring.jpa.show-sql=true

# Formata SQL
spring.jpa.properties.hibernate.format_sql=true

# Destaca SQL no console (Hibernate 6+)
spring.jpa.properties.hibernate.highlight_sql=true

# Mostra comentários do Hibernate
spring.jpa.properties.hibernate.use_sql_comments=true

#Kafka configuration

kafka.bootstrap-server=${KAFKA_HOST:localhost:29092}

kafka.producer.low-stock.topic=${hitbox_low_stock_topic_name:hitbox-low-stock-topic}
kafka.producer.production-delayed.topic=${hitbox_production_delayed_topic_name:hitbox-production-delayed-topic}
kafka.producer.order-ready.topic=${hitbox_order_ready_topic_name:hitbox-order-ready-topic}
kafka.producer.order-pending.topic=${hitbox_order_pending_topic_name:hitbox-order-pending-topic}

kafka.error-producer-topic=hitbox-erros-topic

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.filter=TRACE